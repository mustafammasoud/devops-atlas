<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" font-family="Segoe UI, Tahoma, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="240" fill="#ffffff" rx="8"/>

  <!-- states -->
  <g stroke="#94a3b8" stroke-width="1.5" fill="#f1f5f9">
    <rect x="30" y="95" width="130" height="50" rx="8"/>
    <rect x="215" y="95" width="130" height="50" rx="8"/>
    <rect x="400" y="95" width="130" height="50" rx="8"/>
    <rect x="560" y="30" width="130" height="50" rx="8" fill="#ecfdf5"/>
    <rect x="560" y="160" width="130" height="50" rx="8" fill="#fef2f2"/>
  </g>

  <g fill="#0f172a" font-size="15" text-anchor="middle" dominant-baseline="middle">
    <text x="95" y="121">Pending</text>
    <text x="280" y="121">ContainerCreating</text>
    <text x="465" y="121">Running</text>
    <text x="625" y="56">Succeeded</text>
    <text x="625" y="186">Failed</text>
  </g>

  <!-- arrows -->
  <g stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M160 120 H210"/>
    <path d="M345 120 H395"/>
    <path d="M530 110 L555 65"/>
    <path d="M530 130 L555 175"/>
  </g>

  <g fill="#64748b" font-size="12" text-anchor="middle">
    <text x="545" y="92">exits 0</text>
    <text x="548" y="160">exits != 0</text>
  </g>

  <text x="360" y="220" fill="#64748b" font-size="13" text-anchor="middle">Pod phase lifecycle (simplified)</text>
</svg>
